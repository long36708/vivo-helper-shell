# Android CI：push / PR 到 main 时构建 Debug APK 并上传为构建产物。
#
# 本项目特有的两点约束：
#   1. versionCode = `git rev-list --count HEAD`（app/build.gradle.kts），必须 fetch-depth: 0，
#      否则提交数恒为 1，所有版本 versionCode 撞车。
#   2. local.properties 未入库（.gitignore），CI 中不存在签名配置，
#      app/build.gradle.kts 会走 `signingConfigs.getByName("debug")` 兜底 —— Debug 构建本就如此。
#   3. gradle.properties 里的 org.gradle.java.installations.paths 指向本机 Windows 的 mise JDK，
#      CI 上该路径不存在会被 Gradle 忽略，Java 21 由 setup-java 注入的 JAVA_HOME 自动探测。
name: Android CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "docs-dev/**"
      - "vivo-ota-docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # versionCode 依赖 git rev-list --count HEAD，需要完整提交历史
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vivo-helper-shell-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
