# Release：推送 v* 标签（或手动指定 tag）时构建 Release APK 并发布 GitHub Release。
#
# 签名（可选）—— 在仓库 Settings → Secrets and variables → Actions 配置以下 4 个 Secret：
#   KEYSTORE_BASE64   签名库文件 release-keystore.jks 的 base64（base64 -w0 release-keystore.jks）
#   KEYSTORE_PASS     签名库密码
#   KEY_ALIAS         key 别名
#   KEY_PASSWORD      key 密码
#
# 为什么由工作流生成 local.properties：
#   app/build.gradle.kts 的签名配置【只】从根目录 local.properties 读取
#   （KEYSTORE_PATH / KEYSTORE_PASS / KEY_ALIAS / KEY_PASSWORD），并不读环境变量；
#   而 local.properties 已被 .gitignore 忽略，CI 中默认不存在 ——
#   因此未配置 Secret 时 signingConfigs 不会创建，Release 变体回退到 debug 签名
#   （仍可安装，但无法覆盖安装正式签名包）。
#
# AdMob（可选）—— 用仓库 Variables 覆盖代码内的官方测试 ID：
#   ADMOB_APP_ID / ADMOB_APP_OPEN_ID / ADMOB_BANNER_ID / ADS_ENABLED
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # versionCode 依赖 git rev-list --count HEAD，需要完整提交历史
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Generate local.properties (SDK + signing + ads)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # java.util.Properties 里反斜杠是转义符，密码含 \ 时必须双写
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
            {
              echo "KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.jks"
              echo "KEYSTORE_PASS=$(esc "$KEYSTORE_PASS")"
              echo "KEY_ALIAS=$(esc "$KEY_ALIAS")"
              echo "KEY_PASSWORD=$(esc "$KEY_PASSWORD")"
            } >> local.properties
            echo "Signing config written from secrets."
          else
            echo "::warning::KEYSTORE_* secrets not set -> release APK falls back to DEBUG signing."
          fi

          add_var() { [ -n "$2" ] && echo "$1=$2" >> local.properties || true; }
          add_var ADMOB_APP_ID "${{ vars.ADMOB_APP_ID }}"
          add_var ADMOB_APP_OPEN_ID "${{ vars.ADMOB_APP_OPEN_ID }}"
          add_var ADMOB_BANNER_ID "${{ vars.ADMOB_BANNER_ID }}"
          add_var ADS_ENABLED "${{ vars.ADS_ENABLED }}"

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --no-configuration-cache --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vivo-helper-shell-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
