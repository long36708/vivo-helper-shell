# Dependabot 版本更新配置
# - gradle：读取 gradle/libs.versions.toml 版本目录（含 AGP / Kotlin 插件与依赖）
# - github-actions：更新 .github/workflows 中的 action 版本
# - npm：更新 docs/ 下 VitePress 文档站的依赖
# minor/patch 更新会被合并为一个 PR 以减少噪音；major 更新单独开 PR，便于评估破坏性变更
# （AGP / Kotlin 的大版本升级必须人工确认，别让自动合并直接进 main）。
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    groups:
      docs:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "docs"
